[project]
name = "e2ee-server"
version = "0.1.0"
description = "Lot 1 — serveur FastAPI de la démo E2EE par groupes (stockage de blobs, aucune crypto de contenu)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "psycopg[binary,pool]==3.2.4",
    "pynacl==1.6.2",       # vérification Ed25519 — structurelle uniquement (SPEC §4)
    "cbor2==6.1.3",        # décodage CBOR en lecture seule, jamais réencodé
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "itsdangerous==2.2.0", # cookie de session signé (Starlette SessionMiddleware)
]

# Rappel SPEC §4 : le serveur n'a besoin d'AUCUNE bibliothèque de chiffrement.
# pynacl ne sert qu'à vérifier des signatures. Si `cryptography` apparaît ici,
# c'est une erreur de conception.

[dependency-groups]
dev = [
    "poethepoet==0.32.1",
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "pytest-cov==6.0.0",
    "pyrage==1.3.0",  # utilisé UNIQUEMENT par les tests : le client de référence
]                     # (lot0.model) sert de client HTTP et d'outil de secours

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
serve = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
initdb = "python -m app.db"
test = "pytest -q"
test-cov = "pytest -q --cov=app --cov-report=term-missing --cov-report=xml"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
ci = ["lint", "format-check", "test-cov"]  # séquence : lint → format → tests+couverture

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
